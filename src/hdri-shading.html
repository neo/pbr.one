<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta http-equiv="X-UA-Compatible" content="IE=edge">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<link rel="stylesheet" href="./css/main.css">
		<link rel="icon" type="image/svg+xml" href="https://neo.github.io/resume/assets/images/favicon.svg">
		<title>Panoramic HDR 360 Preview</title>
	</head>
	<body>
		<main id="renderer_target">
			<nav>
				<div class="nav-main-elements">
					<label pbr1-onlyshowifmultivalued="environment_name" for="environment_name" title="environment_name">Environment</label>
					<select 
						onchange="window.PBR1_CHANGE({'environment_index':this.value});"
						pbr1-onlyshowifmultivalued="environment_name"
						pbr1-optionsource="environment_name"
						pbr1-selectedsource="environment_index"
						id="environment_name"
						name="environment_name"
					>
					</select>
					<button id="upload_environment" onclick="document.getElementById('environment_file_input').click();">Upload Environment</button>
					<input type="file" id="environment_file_input" accept=".exr,.hdr" style="display:none;">

					<label id="environment_exposure_label" for="environment_exposure" title="environment_exposure">Exposure</label>
					<input 
						type="number"
						min="-16"
						max="16"
						value="0"
						id="environment_exposure"
						step="0.25"
						oninput="window.PBR1_CHANGE({'environment_exposure':this.value});"
						ondblclick="window.PBR1_CHANGE({'environment_exposure':null},true);"
					>
					<label for="exposure_scroll_enable" title="exposure_scroll_enable">Wheel Exposure</label>
					<input 
						checked="checked"
						type="checkbox"
						id="exposure_scroll_enable"
					>
					<label for="exposure_keys_enable" title="exposure_keys_enable">Arrow Exposure</label>
					<input 
						checked="checked"
						type="checkbox"
						id="exposure_keys_enable"
					>
					<label for="spheres_enable" title="spheres_enable">Show Spheres</label>
					<input 
						checked="checked"
						type="checkbox"
						id="spheres_enable"
						onchange="window.PBR1_CHANGE({'spheres_enable':this.checked ? 1 : 0});"
					>
					<label for="auto_pan_enable" title="auto_pan_enable">Auto Pan</label>
					<input 
						type="checkbox"
						id="auto_pan_enable"
						onchange="window.PBR1_CHANGE({'auto_pan_enable':this.checked ? 1 : 0});"
					>
					<button id="record_video_btn">Record Video</button>
					<button id="take_photo_btn">Take Photo</button>
				</div>
				<label id="gui_enable_label" for="gui_enable" title="gui_enable">hide</label>
				<input 
					checked="checked"
					type="checkbox"
					id="gui_enable"
					onchange="window.PBR1_CHANGE({'gui_enable':this.checked ? '1' : '0'});"
				>
			</nav>
			<button id="fullscreen-toggle" >⛶</button>
			<a class="watermark watermark-off" target="_blank" href="https://pbr.one"><img src="./media/logo.png"></a>
			<span class="message-area" id="messageArea"></span>
			<div id="record_progress_bar"></div>
			<div id="video_preview_container">
				<button id="video_preview_close" title="Close preview">&times;</button>
				<button id="download_video_btn" title="Download video">&#x2913;</button>
				<video id="video_preview" controls loop autoplay></video>
			</div>
		</main>
		<script type="importmap">
			{
				"imports": {
					"three": "https://cdn.jsdelivr.net/npm/three@0.150.0/build/three.module.js",
					"three/addons/": "https://cdn.jsdelivr.net/npm/three@0.150.0/examples/jsm/"
				}
			}
		</script>
		<script type="module" src="./js/views/hdri-shading.js"></script>
	</body>
</html>
